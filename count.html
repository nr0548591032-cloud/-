<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ספירת מלאי – בלי קליטה</title>
<!--
  ספירת מלאי בלי אינטרנט (נובמבר 2026).
  הדף הזה נפתח כשאין קליטה (דרך sw.js), או ישירות בכתובת /count.html.
  - רשימת המוצרים: העותק האחרון שהאפליקציה שמרה בטלפון בפעם האחרונה שהייתה קליטה.
  - הספירה נשמרת בטלפון, באותו מקום שבו הספירה הרגילה שומרת טיוטה.
  - כשנכנסים לאפליקציה עם קליטה – היא מראה מה נספר ושואלת אם לעדכן את המלאי. כלום לא נשלח לבד בלי אישור.
-->
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5ead8;font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#201e1d;font-size:15px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.top b{font-size:19px;display:block}.mut{color:#645c50;font-size:12.5px}
.ib{width:42px;height:42px;border-radius:14px;border:none;background:#fbf7f0;color:#2b2723;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(46,43,37,.10),0 6px 16px rgba(46,43,37,.07);font-size:20px;font-family:inherit;flex:0 0 auto;cursor:pointer}
.warn{display:flex;gap:8px;margin:4px 16px 10px;padding:11px 12px;border-radius:14px;background:#fff0d4;color:#8a5200;font-size:13px}
.warn.on{background:#ddf3e5;color:#18864c}
.bar{height:6px;border-radius:6px;background:#e5ddd0;margin:0 16px 12px;overflow:hidden}.bar i{display:block;height:100%;background:#0e9a9a}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:0 16px 10px}.cats button{border:none;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;background:#fbf7f0;color:#645c50;cursor:pointer}.cats button.on{background:#0e9a9a;color:#fff}
.list{display:flex;flex-direction:column;gap:9px;margin:0 16px 30px}
.it{background:#fbf7f0;border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(46,43,37,.10),0 6px 16px rgba(46,43,37,.06)}
.it .t{flex:1;min-width:0}.it .t b{display:flex;gap:5px;align-items:center;font-size:14px}.it .t b i{color:#18864c;font-style:normal}
.it .v{font-size:24px;font-weight:700;min-width:38px;text-align:center}.it .v.low{color:#d6362f}
.it button{width:40px;height:40px;border-radius:13px;border:none;background:#eee7db;color:#201e1d;font-size:22px;font-family:inherit;cursor:pointer}.it button.p{background:#0e9a9a;color:#fff}
.loose{display:flex;align-items:center;gap:6px;font-size:12px;color:#645c50;margin-top:4px}.loose input{width:56px;height:30px;border-radius:9px;border:1.5px solid rgba(32,30,29,.15);text-align:center;font:inherit}
.empty{text-align:center;padding:50px 24px;color:#645c50;line-height:1.6}
</style>
</head>
<body>
<div class="top"><a class="ib" href="/" aria-label="חזרה לאפליקציה">✕</a><div style="flex:1"><b>ספירת מלאי</b><span class="mut" id="prog"></span></div></div>
<div id="net" class="warn"></div>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div class="cats" id="cats"></div>
<div class="list" id="list"></div>
<script>
(function(){
  "use strict";
  var SNAP = "offcount-snap", DRAFT = "supply-app-v1-countDraft";
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var snap = null; try { snap = JSON.parse(localStorage.getItem(SNAP) || "null"); } catch (e) {}
  var list = document.getElementById("list");
  if (!snap || !Array.isArray(snap.items) || !snap.items.length) {
    list.innerHTML = '<div class="empty"><b>עוד אין רשימת מוצרים בטלפון הזה</b><br>צריך להיכנס פעם אחת לאפליקציה עם קליטה, לטאב רכש ואספקה. אחרי זה אפשר לספור כאן גם בלי קליטה.</div>';
    return;
  }
  var today = new Date(); today = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  var d = null; try { d = JSON.parse(localStorage.getItem(DRAFT) || "null"); } catch (e) {}
  if (!d || !d.entries || d.day !== today) {
    var prev = {}; snap.items.forEach(function(x){ prev[x.k] = +x.cur || 0; });
    d = { day: today, prev: prev, entries: (d && d.entries && d.day === today) ? d.entries : {} };
  }
  function store(){ try { localStorage.setItem(DRAFT, JSON.stringify(d)); } catch (e) {} }
  var cat = "";
  function units(x){ return d.entries[x.k] ? +d.entries[x.k].u : (+x.cur || 0); }
  function draw(){
    var cats = []; snap.items.forEach(function(x){ if (x.c && cats.indexOf(x.c) < 0) cats.push(x.c); });
    document.getElementById("cats").innerHTML = cats.length > 1 ? ['<button type="button" data-c="" class="' + (cat ? "" : "on") + '">הכל</button>'].concat(cats.map(function(c){ return '<button type="button" data-c="' + esc(c) + '" class="' + (cat === c ? "on" : "") + '">' + esc(c) + '</button>'; })).join("") : "";
    var L = snap.items.filter(function(x){ return !cat || x.c === cat; });
    var done = L.filter(function(x){ return d.entries[x.k]; }).length;
    document.getElementById("prog").textContent = done + " מתוך " + L.length + " נספרו";
    document.getElementById("bar").style.width = (L.length ? done / L.length * 100 : 0) + "%";
    list.innerHTML = L.map(function(x){
      var u = units(x), dv = +x.d > 1 ? +x.d : 1, c = Math.floor(u / dv + 1e-9), loose = Math.round((u - c * dv) * 100) / 100;
      var low = +x.min > 0 && u < +x.min;
      return '<div class="it" data-k="' + esc(x.k) + '"><div class="t"><b>' + esc(x.n) + (d.entries[x.k] ? ' <i>✓</i>' : '') + '</b><span class="mut">' + esc(dv > 1 ? "קרטונים (" + dv + " " + (x.u || "יח׳") + ")" : (x.u || "יח׳")) + (x.min ? ' · מינימום ' + esc(dv > 1 ? Math.ceil(x.min / dv) : x.min) : '') + '</span>' +
        (dv > 1 ? '<div class="loose">ועוד בודדים <input type="number" min="0" inputmode="decimal" data-l value="' + (loose || "") + '" placeholder="0"></div>' : '') + '</div>' +
        '<button type="button" data-s="-1" aria-label="פחות">−</button><div class="v' + (low ? " low" : "") + '">' + c + '</div><button type="button" class="p" data-s="1" aria-label="יותר">+</button></div>';
    }).join("");
  }
  function setU(k, u){ d.entries[k] = { u: Math.max(0, Math.round(u * 100) / 100), ok: false }; store(); try { net(); } catch (e) {} }
  list.addEventListener("click", function(e){
    var b = e.target.closest("[data-s]"); if (!b) return;
    var row = b.closest("[data-k]"), k = row.getAttribute("data-k"), x = snap.items.find(function(i){ return i.k === k; }); if (!x) return;
    var dv = +x.d > 1 ? +x.d : 1, u = units(x), c = Math.floor(u / dv + 1e-9), loose = u - c * dv;
    c = Math.max(0, c + Number(b.getAttribute("data-s")));
    setU(k, c * dv + loose); draw();
  });
  list.addEventListener("change", function(e){
    if (!e.target.hasAttribute("data-l")) return;
    var row = e.target.closest("[data-k]"), k = row.getAttribute("data-k"), x = snap.items.find(function(i){ return i.k === k; }); if (!x) return;
    var dv = +x.d > 1 ? +x.d : 1, c = Math.floor(units(x) / dv + 1e-9);
    setU(k, c * dv + (parseFloat(e.target.value) || 0)); draw();
  });
  document.getElementById("cats").addEventListener("click", function(e){ var b = e.target.closest("[data-c]"); if (b) { cat = b.getAttribute("data-c"); draw(); } });
  function net(){
    var n = document.getElementById("net"), pend = Object.keys(d.entries).filter(function(k){ return !d.entries[k].ok; }).length;
    if (navigator.onLine === false) { n.className = "warn"; n.innerHTML = "⚠️ <span><b style=\"display:block\">אין קליטה – הכל נשמר בטלפון</b>" + (pend ? pend + " ספירות מחכות. כשתיכנס לאפליקציה עם קליטה היא תשאל אם לעדכן את המלאי." : "אפשר לספור, הכל נשמר כאן.") + "</span>"; }
    else { n.className = "warn on"; n.innerHTML = "✓ <span><b style=\"display:block\">יש קליטה</b>" + (pend ? pend + " ספירות מחכות – <a href=\"/\" style=\"color:inherit;font-weight:700\">לחץ כאן כדי לעדכן באפליקציה</a>" : "אפשר לחזור לאפליקציה") + "</span>"; }
    var t = new Date(snap.at || 0); document.getElementById("prog").title = "רשימת המוצרים מ-" + t.toLocaleString("he-IL");
  }
  window.addEventListener("online", net); window.addEventListener("offline", net);
  draw(); net();
})();
</script>
</body>
</html>
